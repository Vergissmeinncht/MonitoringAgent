server:
  port: 9900

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md,markdown,pdf,doc,docx

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope ??
spring:
  ai:
    dashscope:
      api-key: ${DASH_SCOPE_API_KEY}  # ?????????????
      chat:
        options:
          timeout: 180000  # ????180??3???
      retry:
        max-attempts: 3  # ??????
        backoff:
          initial-interval: 2000  # ??????2?
          multiplier: 2  # ??????
          max-interval: 10000  # ??????10?
    # Spring AI MCP ?????
    # ????mock???????????
    mcp:
      client:
        enabled: true
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: http://localhost:3300
              sse-endpoint: /sse  # ???SSE????

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  # MongoDB：会话持久化与长期记忆正文存储
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/monitoring_agent}



# ??? DashScope Embedding API ??
dashscope:
  api:
    key: ${DASH_SCOPE_API_KEY}  # ??????????????????????
  embedding:
    model: text-embedding-v4  # ??????????

# ??????
document:
  chunk:
    max-size: 800  # ?????????
    overlap: 100   # ??????????

# RAG ??
rag:
  top-k: 10  # ????????????
  model: "qwen3-max"  # ???????
  rerank:
    model: "gte-rerank-v2"  # ??????????
    top-n: 3  # ?????????????
  hybrid:
    vector-top-k: 10   # 向量召回候选数
    bm25-top-k: 10     # BM25 召回候选数
    candidate-limit: 20  # 融合去重后进入重排的候选上限
  bm25:
    index-path: ./volumes/bm25-index  # Lucene 本地索引目录
  diagnosis:
    enable-reflection: true  # 是否启用诊断反思 prompt
  embedding:
    cache:
      enabled: true        # 查询向量缓存开关
      max-size: 1000       # 缓存最大条目数
      ttl-minutes: 60      # 缓存过期时间（分钟）

# Chat memory
chat:
  memory:
    enabled: true
    max-context-tokens: 1000000
    compression-threshold-ratio: 0.7
    reserved-output-tokens: 2000
    min-recent-message-pairs: 3
    summary-max-tokens: 1000

# 记忆系统（阶段一：会话持久化；后续阶段扩展长期记忆）
memory:
  persistence:
    enabled: true          # 会话历史与 summary 落库开关
  long-term:
    enabled: true
    extraction-enabled: true
    retrieval-top-k: 5
    confidence-threshold: 0.75
    max-memories-per-user: 500
    semantic-search-enabled: false

# Prometheus ??
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # ???????
  mock-enabled: false  # ???? Mock ????????

# CLS ???????
cls:
  mock-enabled: true  # ???? Mock ?????????? true ???????????????
