<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 链路测试</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { overflow: auto; background: #f8fafd; }
        .rag-page { min-height: 100vh; padding: 24px; }
        .rag-header { max-width: 1200px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        .rag-title h1 { font-size: 28px; color: #202124; margin-bottom: 6px; }
        .rag-title p { color: #5f6368; font-size: 14px; }
        .rag-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
        .rag-card { background: #fff; border: 1px solid #dadce0; border-radius: 18px; padding: 20px; box-shadow: 0 2px 8px rgba(60,64,67,.08); }
        .rag-card h2 { font-size: 18px; margin-bottom: 14px; }
        .rag-form { display: flex; flex-direction: column; gap: 12px; }
        .rag-form label { font-size: 13px; color: #3c4043; font-weight: 500; }
        .rag-input, .rag-textarea, .rag-select { width: 100%; border: 1px solid #dadce0; border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; }
        .rag-textarea { min-height: 96px; resize: vertical; }
        .rag-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .rag-btn { border: none; border-radius: 999px; padding: 10px 16px; cursor: pointer; font-size: 14px; font-weight: 500; background: #e8f0fe; color: #1967d2; }
        .rag-btn.primary { background: #1a73e8; color: #fff; }
        .rag-btn.danger { background: #fce8e6; color: #c5221f; }
        .rag-btn:disabled { opacity: .55; cursor: not-allowed; }
        .rag-stack { display: flex; flex-direction: column; gap: 20px; }
        .rag-table-wrap { overflow-x: auto; }
        .rag-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .rag-table th, .rag-table td { border-bottom: 1px solid #edf0f2; padding: 10px; vertical-align: top; text-align: left; }
        .rag-table th { color: #5f6368; font-weight: 600; background: #f8fafd; }
        .rag-table input, .rag-table textarea { width: 100%; border: 1px solid #dadce0; border-radius: 8px; padding: 8px; font-size: 13px; }
        .rag-table textarea { min-height: 70px; resize: vertical; }
        .rag-empty { color: #80868b; padding: 20px; text-align: center; border: 1px dashed #dadce0; border-radius: 12px; }
        .rag-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
        .summary-item { background: #f8fafd; border-radius: 12px; padding: 12px; }
        .summary-item span { display: block; color: #5f6368; font-size: 12px; }
        .summary-item strong { font-size: 20px; color: #202124; }
        .status-pass { color: #188038; font-weight: 600; }
        .status-fail { color: #d93025; font-weight: 600; }
        .rag-toast { position: fixed; right: 24px; bottom: 24px; background: #202124; color: #fff; padding: 12px 16px; border-radius: 10px; opacity: 0; transform: translateY(12px); transition: all .2s; z-index: 10; }
        .rag-toast.show { opacity: 1; transform: translateY(0); }
        @media (max-width: 900px) { .rag-grid { grid-template-columns: 1fr; } .rag-summary { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <main class="rag-page">
        <header class="rag-header">
            <div class="rag-title">
                <h1>RAG 链路测试</h1>
                <p>生成测试集、执行检索增强生成测试，并导出评测结果。</p>
            </div>
            <a class="rag-btn" href="/">返回聊天页</a>
        </header>

        <section class="rag-grid">
            <aside class="rag-card">
                <h2>生成测试集</h2>
                <div class="rag-form">
                    <div>
                        <label for="topicInput">测试主题</label>
                        <input id="topicInput" class="rag-input" value="AI Ops 运维故障处理" placeholder="例如：CPU 高负载排查">
                    </div>
                    <div>
                        <label for="countInput">数量（最多 20 条）</label>
                        <input id="countInput" class="rag-input" type="number" min="1" max="20" value="5">
                    </div>
                    <div>
                        <label for="difficultySelect">难度</label>
                        <select id="difficultySelect" class="rag-select">
                            <option value="简单">简单</option>
                            <option value="中等" selected>中等</option>
                            <option value="困难">困难</option>
                        </select>
                    </div>
                    <div>
                        <label for="referenceInput">生成要求</label>
                        <textarea id="referenceInput" class="rag-textarea" placeholder="说明希望覆盖的场景、故障类型或评测重点。">覆盖故障现象、原因分析、排查步骤和修复建议。</textarea>
                    </div>
                    <div class="rag-actions">
                        <button id="generateBtn" class="rag-btn primary">生成测试集</button>
                        <button id="addCaseBtn" class="rag-btn">手动新增</button>
                    </div>
                </div>
            </aside>

            <section class="rag-stack">
                <div class="rag-card">
                    <h2>测试集</h2>
                    <div class="rag-actions">
                        <button id="importTestSetBtn" class="rag-btn">导入 JSON</button>
                        <button id="exportTestSetJsonBtn" class="rag-btn">导出 JSON</button>
                        <button id="exportTestSetCsvBtn" class="rag-btn">导出 CSV</button>
                        <button id="runBtn" class="rag-btn primary">执行测试</button>
                        <input id="importTestSetInput" type="file" accept="application/json,.json" style="display: none;">
                    </div>
                    <div id="testCasesContainer" class="rag-table-wrap"></div>
                </div>

                <div class="rag-card">
                    <h2>测试结果</h2>
                    <div id="summaryContainer"></div>
                    <div class="rag-actions">
                        <button id="exportResultsJsonBtn" class="rag-btn">导出 JSON</button>
                        <button id="exportResultsCsvBtn" class="rag-btn">导出 CSV</button>
                    </div>
                    <div id="resultsContainer" class="rag-table-wrap"></div>
                </div>
            </section>
        </section>
    </main>

    <div id="toast" class="rag-toast"></div>
    <script src="rag-test.js"></script>
</body>
</html>
